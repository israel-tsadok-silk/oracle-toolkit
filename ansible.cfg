[defaults]
inventory                       = ./inventory
deprecation_warnings            = False
become_method                   = sudo
retry_files_enabled             = False
#display_skipped_hosts          = False
#stdout_callback                = debug
#stderr_callback                = debug
# Enable world-readable tmp files to avoid ACL permission issues when becoming unprivileged users
allow_world_readable_tmpfiles   = true
#remote_tmp                     = /tmp/ansible
interpreter_python              = auto_legacy_silent
command_warnings                = False

[ssh_connection]
# Note: pipelining can cause issues with some sudo configurations
# Using allow_world_readable_tmpfiles instead
# pipelining                      = True
